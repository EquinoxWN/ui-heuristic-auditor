name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same browser location as the Makefile uses locally.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/ms-playwright
    steps:
      # Every action is pinned to a full commit SHA; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make setup
      # Chromium plus the system libraries it needs on Ubuntu.
      - run: python -m playwright install --with-deps chromium
      - run: make lint test
      - name: Audit a real public page (job summary)
        run: ui-audit https://example.com --out example-report && cat example-report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Known-vulnerability audit
        run: make audit
