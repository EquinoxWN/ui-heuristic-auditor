[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-heuristic-auditor"
version = "0.1.0"
description = "Flags usability and accessibility problems on any screen automatically, with the evidence and a suggested fix."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.64,<2"]

[project.optional-dependencies]
dev = ["pytest>=9.2", "pytest-timeout>=2.4", "ruff>=0.17", "mypy>=2.4", "pip-audit>=2.10"]

[project.scripts]
ui-audit = "ui_heuristic_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
timeout = 120

[tool.ruff]
line-length = 100
extend-exclude = [".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
