<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seeded problems</title>
  <style>
    body { font-family: sans-serif; color: #1a1a1a; background: #ffffff; }
    .faint { color: #c8c8c8; }
  </style>
</head>
<body>
  <main>
    <h1>Checkout</h1>
    <!-- seeded: image without alternative text (image-alt) -->
    <img id="hero" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="40" height="40">
    <!-- seeded: input without a label (label) -->
    <input id="coupon" type="text">
    <!-- seeded: icon button without an accessible name (button-name) -->
    <button id="close"></button>
    <!-- seeded: link without text (link-name) -->
    <a id="empty-link" href="#top"></a>
    <!-- seeded: text below 4.5:1 contrast (color-contrast) -->
    <p id="faint" class="faint">Delivery in 3 to 5 working days.</p>
  </main>
</body>
</html>
